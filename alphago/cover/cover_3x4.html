<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>AlphaGo Cover 3x4</title>
<style>
  :root {
    --src: url("../frames/v_teaser_tree_4k.png");   /* 2160x3840, drawn at 1080x1920 */
    --stone-x: 540px; --stone-y: 864px;     /* in the frame (1080x1920) */
    --land-x: 540px;  --land-y: 1090px;     /* on the cover (1080x1440) */
    --bg: #14161b; --text: #f2efe8; --dim: #9aa0aa; --teal: #5CD0B3; --red: #FC6255; --orange: #FF862F;
  }
  html, body { margin: 0; width: 1080px; height: 1440px; background: var(--bg); overflow: hidden; }
  .stage { position: relative; width: 1080px; height: 1440px; overflow: hidden; background: var(--bg); }
  .frame, .bloom {
    position: absolute; width: 1080px; height: 1920px;
    left: calc(var(--land-x) - var(--stone-x)); top: calc(var(--land-y) - var(--stone-y));
    background: var(--src) no-repeat; background-size: 1080px 1920px;
    transform-origin: var(--stone-x) var(--stone-y); transform: scale(1.12);
  }
  .bloom { filter: blur(14px) brightness(1.7) saturate(1.4); mix-blend-mode: screen; opacity: .28; }
  .glow {
    position: absolute; left: calc(var(--land-x) - 230px); top: calc(var(--land-y) - 230px);
    width: 460px; height: 460px; border-radius: 50%;
    background: radial-gradient(circle, rgba(255,134,47,.42) 0%, rgba(255,134,47,.15) 38%, rgba(255,134,47,0) 70%);
    mix-blend-mode: screen;
  }
  /* top fade for the title + radial vignette that also hides the frame's edge bands */
  .shade {
    position: absolute; inset: 0;
    background:
      linear-gradient(180deg, rgba(20,22,27,.98) 0%, rgba(20,22,27,.92) 26%, rgba(20,22,27,0) 46%),
      radial-gradient(ellipse 70% 55% at 50% 72%, rgba(20,22,27,0) 50%, rgba(20,22,27,.85) 100%);
  }
  .grain { position: absolute; inset: 0; opacity: .05; mix-blend-mode: overlay;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"); }
  .text { position: absolute; left: 0; right: 0; top: 96px; text-align: center; font-family: "PingFang SC", sans-serif; }
  .tag { font-size: 36px; font-weight: 500; color: var(--dim); letter-spacing: 4px; }
  .tag b { color: var(--orange); font-weight: 600; }
  .hero { margin-top: 22px; font-size: 150px; line-height: 1.1; font-weight: 600; color: var(--text); letter-spacing: 2px;
    text-shadow: 0 6px 30px rgba(0,0,0,.6); }
  .hero .q { color: var(--red); }
  .sub { margin-top: 26px; font-size: 56px; font-weight: 500; color: var(--teal); letter-spacing: 3px; }
</style>
</head>
<body>
<div class="stage">
  <div class="frame"></div>
  <div class="bloom"></div>
  <div class="shade"></div>
  <div class="grain"></div>
  <div class="text">
    <div class="tag">AlphaGo · <b>第37手</b></div>
    <div class="hero">它在想什么<span class="q">？</span></div>
    <div class="sub">人类几乎不会下的一手</div>
  </div>
</div>
</body>
</html>
